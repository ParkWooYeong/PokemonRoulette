    <style>
        @import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;600;700;800&display=swap');

        :root {
            --sky-1: #9ad6ff;
            --sky-2: #e9f9ff;
            --ui-ink: #1e293b;
            --panel-1: rgba(255, 255, 255, 0.95);
            --panel-2: rgba(240, 251, 243, 0.9);
            --field-1: #6fba62;
            --field-2: #58a650;
            --field-3: #2e7f3f;
            --btn-1: #ffe066;
            --btn-2: #ffbf3a;
            --btn-shadow: #cd8f00;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: clamp(20px, 4vh, 52px) 16px clamp(42px, 7vh, 88px);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
            color: var(--ui-ink);
            text-align: center;
            position: relative;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 17% 12%, rgba(255, 255, 255, 0.65), transparent 32%),
                radial-gradient(circle at 82% 14%, rgba(255, 255, 255, 0.52), transparent 30%),
                linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 40%, #a8db86 41%, #5ca852 100%);
        }

        body::before {
            content: "";
            position: fixed;
            left: -8vw;
            right: -8vw;
            bottom: 16vh;
            height: 28vh;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(42% 120% at 10% 100%, var(--field-1) 0%, var(--field-1) 60%, transparent 61%),
                radial-gradient(40% 115% at 36% 100%, #5eae55 0%, #5eae55 62%, transparent 63%),
                radial-gradient(44% 120% at 67% 100%, #6cba60 0%, #6cba60 60%, transparent 61%),
                radial-gradient(42% 120% at 94% 100%, var(--field-2) 0%, var(--field-2) 58%, transparent 59%);
            opacity: 0.9;
        }

        body::after {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 24vh;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(48% 120% at 8% 100%, rgba(58, 136, 59, 0.95) 0%, rgba(58, 136, 59, 0.95) 63%, transparent 64%),
                radial-gradient(44% 115% at 34% 100%, rgba(52, 126, 53, 0.96) 0%, rgba(52, 126, 53, 0.96) 61%, transparent 62%),
                radial-gradient(46% 120% at 60% 100%, rgba(44, 116, 48, 0.95) 0%, rgba(44, 116, 48, 0.95) 62%, transparent 63%),
                radial-gradient(42% 120% at 86% 100%, rgba(49, 124, 52, 0.95) 0%, rgba(49, 124, 52, 0.95) 61%, transparent 62%),
                linear-gradient(180deg, rgba(96, 170, 78, 0.35) 0%, rgba(34, 99, 43, 0.94) 80%);
            opacity: 0.8;
        }

        .sky-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .sky-layer::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0;
            background:
                radial-gradient(circle at 9% 14%, rgba(255, 255, 255, 0.95) 0 1px, transparent 2px),
                radial-gradient(circle at 21% 8%, rgba(227, 241, 255, 0.92) 0 1.4px, transparent 2.8px),
                radial-gradient(circle at 36% 19%, rgba(238, 248, 255, 0.92) 0 1.2px, transparent 2.6px),
                radial-gradient(circle at 48% 9%, rgba(255, 255, 255, 0.96) 0 1.3px, transparent 2.7px),
                radial-gradient(circle at 63% 16%, rgba(233, 244, 255, 0.92) 0 1.1px, transparent 2.4px),
                radial-gradient(circle at 76% 11%, rgba(249, 253, 255, 0.95) 0 1.3px, transparent 2.8px),
                radial-gradient(circle at 88% 7%, rgba(234, 246, 255, 0.9) 0 1px, transparent 2.4px),
                radial-gradient(circle at 14% 27%, rgba(244, 251, 255, 0.88) 0 1px, transparent 2.3px),
                radial-gradient(circle at 57% 24%, rgba(224, 239, 255, 0.86) 0 1.2px, transparent 2.7px),
                radial-gradient(circle at 84% 20%, rgba(241, 249, 255, 0.9) 0 1px, transparent 2.3px);
            transition: opacity 360ms ease;
        }

        .sky-layer::after {
            content: "";
            position: absolute;
            top: 7%;
            right: 11%;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            opacity: 0;
            transform: scale(0.86);
            background: radial-gradient(circle at 34% 30%, #ffffff, #e8f0ff 48%, #c7d8f8 100%);
            box-shadow: 0 0 24px rgba(216, 231, 255, 0.65);
            transition: opacity 360ms ease, transform 360ms ease;
        }

        .cloud {
            position: absolute;
            top: var(--top);
            left: -30vw;
            width: var(--width);
            height: calc(var(--width) * 0.24);
            border-radius: var(--radius, 999px);
            opacity: var(--opacity);
            background: var(--cloud-shape,
                radial-gradient(44% 92% at 20% 56%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.42) 58%, transparent 86%),
                radial-gradient(48% 96% at 50% 44%, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.38) 60%, transparent 88%),
                radial-gradient(42% 90% at 80% 57%, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.34) 58%, transparent 86%)
            );
            filter: blur(var(--blur, 1.2px));
            animation: cloud-drift var(--duration) linear infinite;
            animation-delay: var(--delay);
            will-change: transform;
        }

        .cloud:nth-child(1) {
            --top: 8%;
            --width: 300px;
            --duration: 82s;
            --delay: -18s;
            --opacity: 0.54;
            --blur: 1.3px;
            --radius: 62% 38% 50% 50% / 56% 48% 52% 44%;
            --cloud-shape:
                radial-gradient(48% 96% at 17% 57%, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.44) 56%, transparent 84%),
                radial-gradient(50% 98% at 51% 42%, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.4) 60%, transparent 87%),
                radial-gradient(38% 85% at 82% 60%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.32) 58%, transparent 86%);
        }

        .cloud:nth-child(2) {
            --top: 15%;
            --width: 250px;
            --duration: 70s;
            --delay: -42s;
            --opacity: 0.5;
            --blur: 1.1px;
            --radius: 48% 52% 44% 56% / 60% 43% 57% 40%;
            --cloud-shape:
                radial-gradient(38% 88% at 22% 54%, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.4) 54%, transparent 83%),
                radial-gradient(56% 100% at 55% 44%, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.34) 61%, transparent 89%),
                radial-gradient(34% 80% at 84% 58%, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.3) 56%, transparent 84%);
        }

        .cloud:nth-child(3) {
            --top: 22%;
            --width: 340px;
            --duration: 88s;
            --delay: -56s;
            --opacity: 0.56;
            --blur: 1.5px;
            --radius: 58% 42% 55% 45% / 52% 50% 50% 48%;
            --cloud-shape:
                radial-gradient(42% 90% at 15% 59%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.42) 57%, transparent 85%),
                radial-gradient(54% 98% at 49% 40%, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.38) 62%, transparent 88%),
                radial-gradient(44% 92% at 80% 56%, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.34) 58%, transparent 86%);
        }

        .cloud:nth-child(4) {
            --top: 11%;
            --width: 230px;
            --duration: 66s;
            --delay: -24s;
            --opacity: 0.48;
            --blur: 1.1px;
            --radius: 54% 46% 41% 59% / 48% 57% 43% 52%;
            --cloud-shape:
                radial-gradient(40% 86% at 19% 56%, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.36) 55%, transparent 84%),
                radial-gradient(45% 90% at 52% 46%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.3) 60%, transparent 87%),
                radial-gradient(36% 82% at 79% 60%, rgba(255, 255, 255, 0.76), rgba(255, 255, 255, 0.28) 57%, transparent 84%);
        }

        .cloud:nth-child(5) {
            --top: 28%;
            --width: 280px;
            --duration: 80s;
            --delay: -65s;
            --opacity: 0.52;
            --blur: 1.4px;
            --radius: 46% 54% 58% 42% / 55% 45% 55% 45%;
            --cloud-shape:
                radial-gradient(46% 92% at 18% 58%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.4) 56%, transparent 85%),
                radial-gradient(50% 96% at 54% 43%, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.34) 60%, transparent 88%),
                radial-gradient(40% 86% at 83% 58%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.3) 57%, transparent 85%);
        }

        @keyframes cloud-drift {
            from { transform: translateX(0); }
            to { transform: translateX(148vw); }
        }

        .field-glow {
            position: fixed;
            left: 50%;
            bottom: 18vh;
            width: min(74vw, 860px);
            height: 210px;
            transform: translateX(-50%);
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(197, 255, 139, 0.72) 0%, rgba(127, 201, 88, 0.34) 42%, transparent 72%);
            filter: blur(14px);
            opacity: 0.7;
        }

        body,
        body::before,
        body::after,
        .container,
        .container::before,
        .container::after,
        .field-glow,
        .pokeball-container,
        .meta-badge {
            transition: background 360ms ease, box-shadow 360ms ease, border-color 360ms ease, color 320ms ease, opacity 360ms ease, filter 360ms ease;
        }

        body[data-theme="night"] {
            background:
                radial-gradient(circle at 14% 8%, rgba(203, 220, 255, 0.26), transparent 26%),
                radial-gradient(circle at 84% 12%, rgba(180, 208, 255, 0.2), transparent 25%),
                linear-gradient(180deg, #0f1d3a 0%, #1f3357 44%, #243f37 45%, #19352d 100%);
        }

        body[data-theme="night"]::before {
            background:
                radial-gradient(44% 120% at 10% 100%, rgba(42, 82, 58, 0.94) 0%, rgba(42, 82, 58, 0.94) 60%, transparent 61%),
                radial-gradient(42% 118% at 36% 100%, rgba(38, 74, 54, 0.95) 0%, rgba(38, 74, 54, 0.95) 62%, transparent 63%),
                radial-gradient(46% 120% at 67% 100%, rgba(44, 86, 61, 0.94) 0%, rgba(44, 86, 61, 0.94) 60%, transparent 61%),
                radial-gradient(44% 118% at 94% 100%, rgba(38, 77, 56, 0.95) 0%, rgba(38, 77, 56, 0.95) 58%, transparent 59%);
            opacity: 0.86;
        }

        body[data-theme="night"]::after {
            background:
                radial-gradient(48% 120% at 8% 100%, rgba(34, 80, 53, 0.96) 0%, rgba(34, 80, 53, 0.96) 63%, transparent 64%),
                radial-gradient(44% 115% at 34% 100%, rgba(29, 69, 47, 0.96) 0%, rgba(29, 69, 47, 0.96) 61%, transparent 62%),
                radial-gradient(46% 120% at 60% 100%, rgba(24, 59, 43, 0.95) 0%, rgba(24, 59, 43, 0.95) 62%, transparent 63%),
                radial-gradient(42% 120% at 86% 100%, rgba(28, 65, 46, 0.95) 0%, rgba(28, 65, 46, 0.95) 61%, transparent 62%),
                linear-gradient(180deg, rgba(35, 88, 61, 0.26) 0%, rgba(14, 36, 27, 0.96) 82%);
            opacity: 0.92;
        }

        body[data-theme="night"] .sky-layer::before {
            opacity: 0.92;
        }

        body[data-theme="night"] .sky-layer::after {
            opacity: 1;
            transform: scale(1);
        }

        body[data-theme="night"] .cloud {
            opacity: 0.38;
            filter: blur(1.9px) brightness(0.85);
        }

        body[data-theme="night"] .leaf {
            background: linear-gradient(135deg, #78ab8e, #325f4a);
            box-shadow: inset -2px -1px 0 rgba(18, 56, 39, 0.52);
        }

        body[data-theme="night"] .field-glow {
            background: radial-gradient(ellipse at center, rgba(105, 153, 255, 0.42) 0%, rgba(78, 121, 211, 0.2) 42%, transparent 72%);
            filter: blur(18px);
            opacity: 0.5;
        }

        body[data-theme="night"] .container {
            border-color: #1c2a3d;
            background: linear-gradient(180deg, #c24350 0 46%, #dce2ee 46% 100%);
            box-shadow: 0 28px 58px rgba(2, 8, 20, 0.52), 0 10px 22px rgba(5, 10, 24, 0.34);
        }

        body[data-theme="night"] .container::before {
            background: #1c2a3d;
        }

        body[data-theme="night"] .container::after {
            border-color: #1c2a3d;
            box-shadow: inset 0 0 0 5px #c6cfdb;
        }

        body[data-theme="night"] .pokeball-container {
            border-color: rgba(132, 183, 151, 0.42);
            background:
                linear-gradient(180deg, rgba(206, 231, 212, 0.88), rgba(170, 206, 170, 0.84)),
                repeating-radial-gradient(circle at 0 0, rgba(255, 255, 255, 0.16) 0 2px, transparent 2px 16px);
        }

        .leaf-layer {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .leaf {
            position: absolute;
            top: -14vh;
            left: var(--left);
            width: var(--size);
            height: calc(var(--size) * 0.62);
            border-radius: 85% 15% 80% 20%;
            background: linear-gradient(135deg, #8ce27b, #3f9b4c);
            box-shadow: inset -2px -1px 0 rgba(40, 122, 42, 0.45);
            opacity: 0;
            transform-origin: center;
            animation: leaf-fall var(--duration) linear infinite;
            animation-delay: var(--delay);
            will-change: transform, opacity;
        }

        .leaf::after {
            content: "";
            position: absolute;
            top: 48%;
            left: 16%;
            width: 68%;
            height: 1.5px;
            background: rgba(24, 92, 28, 0.48);
            transform: rotate(-24deg);
            border-radius: 999px;
        }

        .leaf:nth-child(1)  { --left: 5%;  --size: 12px; --duration: 12s; --delay: -2s;  --sway-a: 16px;  --sway-b: -26px; --sway-c: 22px; }
        .leaf:nth-child(2)  { --left: 14%; --size: 15px; --duration: 15s; --delay: -7s;  --sway-a: -18px; --sway-b: 28px;  --sway-c: -20px; }
        .leaf:nth-child(3)  { --left: 24%; --size: 13px; --duration: 13s; --delay: -5s;  --sway-a: 20px;  --sway-b: -24px; --sway-c: 18px; }
        .leaf:nth-child(4)  { --left: 33%; --size: 11px; --duration: 11s; --delay: -1s;  --sway-a: -14px; --sway-b: 22px;  --sway-c: -16px; }
        .leaf:nth-child(5)  { --left: 42%; --size: 16px; --duration: 16s; --delay: -10s; --sway-a: 22px;  --sway-b: -30px; --sway-c: 16px; }
        .leaf:nth-child(6)  { --left: 51%; --size: 10px; --duration: 10s; --delay: -4s;  --sway-a: -12px; --sway-b: 18px;  --sway-c: -12px; }
        .leaf:nth-child(7)  { --left: 60%; --size: 14px; --duration: 14s; --delay: -8s;  --sway-a: 19px;  --sway-b: -20px; --sway-c: 24px; }
        .leaf:nth-child(8)  { --left: 69%; --size: 12px; --duration: 12.5s; --delay: -3s; --sway-a: -17px; --sway-b: 25px; --sway-c: -21px; }
        .leaf:nth-child(9)  { --left: 77%; --size: 15px; --duration: 15.5s; --delay: -6s; --sway-a: 24px;  --sway-b: -28px; --sway-c: 18px; }
        .leaf:nth-child(10) { --left: 85%; --size: 11px; --duration: 11.5s; --delay: -9s; --sway-a: -13px; --sway-b: 19px; --sway-c: -14px; }
        .leaf:nth-child(11) { --left: 92%; --size: 13px; --duration: 13.5s; --delay: -11s; --sway-a: 16px; --sway-b: -21px; --sway-c: 15px; }
        .leaf:nth-child(12) { --left: 97%; --size: 10px; --duration: 10.8s; --delay: -5.5s; --sway-a: -10px; --sway-b: 16px; --sway-c: -11px; }

        @keyframes leaf-fall {
            0% {
                transform: translate3d(0, -14vh, 0) rotate(0deg);
                opacity: 0;
            }
            12% {
                opacity: 0.75;
            }
            35% {
                transform: translate3d(var(--sway-a), 34vh, 0) rotate(165deg);
            }
            68% {
                transform: translate3d(var(--sway-b), 72vh, 0) rotate(340deg);
            }
            100% {
                transform: translate3d(var(--sway-c), 114vh, 0) rotate(520deg);
                opacity: 0;
            }
        }

        .container {
            width: min(430px, 100%);
            padding: 30px 28px 26px;
            border-radius: 34px;
            border: 6px solid #263238;
            background: linear-gradient(180deg, #ef5350 0 46%, #f5f7fb 46% 100%);
            box-shadow: 0 26px 54px rgba(27, 63, 39, 0.22), 0 10px 24px rgba(0, 0, 0, 0.14);
            position: relative;
            z-index: 3;
            overflow: hidden;
            animation: panel-pop 520ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .main-board {
            display: grid;
            grid-template-columns: minmax(0, 430px) minmax(280px, 340px);
            gap: 18px;
            align-items: start;
            justify-content: center;
            width: min(880px, 100%);
            margin: 0 auto;
            position: relative;
        }

        .main-board > .container,
        .main-board > .history-panel {
            align-self: start;
        }

        .history-panel {
            margin-top: 0;
            max-height: calc(100vh - 108px);
            overflow-y: auto;
        }

        .container::before {
            content: "";
            position: absolute;
            top: calc(46% - 6px);
            left: -2px;
            right: -2px;
            height: 12px;
            background: #263238;
            z-index: 0;
        }

        .container::after {
            content: "";
            position: absolute;
            top: calc(46% - 18px);
            left: 50%;
            width: 38px;
            height: 38px;
            transform: translateX(-50%);
            border-radius: 50%;
            border: 6px solid #263238;
            background: #ffffff;
            box-shadow: inset 0 0 0 5px #d8dde3;
            z-index: 1;
        }

        .container > * {
            position: relative;
            z-index: 2;
        }

        h1 {
            margin: 16px 0 20px;
            font-family: "Do Hyeon", "Noto Sans KR", sans-serif;
            font-size: clamp(1.8rem, 4.6vw, 2.6rem);
            line-height: 1.1;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 3px 0 rgba(16, 33, 49, 0.4);
        }

        .subtitle {
            margin: -10px 0 14px;
            color: rgba(255, 255, 255, 0.88);
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 2px 0 rgba(16, 33, 49, 0.3);
        }

        .meta-badges {
            margin: 0 0 14px;
            position: relative;
            z-index: 8;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .meta-badge {
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.26);
            border: 1px solid rgba(255, 255, 255, 0.42);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(1px);
        }

        .picker-wrap {
            position: relative;
        }

        .native-select-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            border: 0;
            padding: 0;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .picker-trigger {
            min-width: 94px;
            padding: 5px 28px 5px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.54);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.18));
            color: #ffffff;
            font: inherit;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1.1;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
            cursor: pointer;
            position: relative;
            transition: transform 0.14s ease, background 0.24s ease, border-color 0.24s ease, box-shadow 0.24s ease;
        }

        .picker-trigger::after {
            content: "";
            position: absolute;
            right: 10px;
            top: 50%;
            width: 6px;
            height: 6px;
            border-right: 2px solid rgba(255, 255, 255, 0.95);
            border-bottom: 2px solid rgba(255, 255, 255, 0.95);
            transform: translateY(-65%) rotate(45deg);
            transition: transform 0.16s ease;
        }

        .picker-trigger:hover {
            transform: translateY(-1px);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.22));
        }

        .picker-trigger:focus-visible {
            outline: 2px solid rgba(255, 236, 164, 0.95);
            outline-offset: 1px;
        }

        .picker-wrap.open .picker-trigger {
            box-shadow: 0 3px 10px rgba(17, 38, 73, 0.22);
        }

        .picker-wrap.open .picker-trigger::after {
            transform: translateY(-30%) rotate(-135deg);
        }

        .picker-menu {
            list-style: none;
            margin: 0;
            padding: 6px;
            position: absolute;
            top: calc(100% + 8px);
            bottom: auto;
            left: 50%;
            min-width: 114px;
            max-height: 244px;
            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
            transform: translateX(-50%) translateY(-6px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.62);
            background: linear-gradient(180deg, rgba(243, 251, 255, 0.96), rgba(216, 232, 244, 0.96));
            box-shadow: 0 14px 26px rgba(15, 34, 52, 0.25);
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            z-index: 16;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

                <h2 id="history-title">최근 획득</h2>
                <div>
                    <span class="history-count">총 <strong id="history-count">0</strong>마리</span>
                    <button id="clear-history-btn" class="clear-history-btn" type="button" aria-label="최근 획득 기록 삭제" disabled>삭제</button>
                </div>
            </div>
            <p class="history-empty" id="history-empty">아직 포켓몬을 잡지 않았어요.</p>
            <ul class="history-list" id="history-list" aria-live="polite"></ul>

            <section class="collection-panel" aria-labelledby="collection-title">
                <div class="collection-header">
                    <h3 id="collection-title">내 도감</h3>
                    <div>
                        <span class="collection-count">총 <strong id="collection-count">0</strong>마리</span>
                        <button id="clear-collection-btn" class="clear-history-btn" type="button" aria-label="도감 초기화" disabled>초기화</button>
                    </div>
                </div>
                <div class="collection-grid" id="collection-grid" aria-live="polite"></div>
            </section>
        </section>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeStorageKey = 'roulette-theme';
        const generationSelect = document.getElementById('generation-select');
        const generationPickerWrap = document.getElementById('generation-picker-wrap');
        const generationTrigger = document.getElementById('generation-trigger');
        const generationMenu = document.getElementById('generation-menu');
        const generationStorageKey = 'roulette-generation-mode';
        const encounterSelect = document.getElementById('encounter-select');
        const encounterPickerWrap = document.getElementById('encounter-picker-wrap');
        const encounterTrigger = document.getElementById('encounter-trigger');
        const encounterMenu = document.getElementById('encounter-menu');
        const encounterStorageKey = 'roulette-encounter-mode';
        const typeSelect = document.getElementById('type-select');
        const typePickerWrap = document.getElementById('type-picker-wrap');
        const typeTrigger = document.getElementById('type-trigger');
        const typeMenu = document.getElementById('type-menu');
        const typeStorageKey = 'roulette-type-mode';
        const shinyToggleBtn = document.getElementById('shiny-toggle');
        const shinyStorageKey = 'roulette-shiny-mode';
        const historyStorageKey = 'roulette-history';
        const historyList = document.getElementById('history-list');
        const historyCount = document.getElementById('history-count');
        const historyEmpty = document.getElementById('history-empty');
        const clearHistoryBtn = document.getElementById('clear-history-btn');
        const collectionStorageKey = 'roulette-pokedex';
        const collectionGrid = document.getElementById('collection-grid');
        const collectionCountEl = document.getElementById('collection-count');
        const clearCollectionBtn = document.getElementById('clear-collection-btn');
        let spinHistory = [];
        let collection = {};
        const generationModes = [
            { key: 'gen1', label: '1세대', min: 1, max: 151 },
            { key: 'gen2', label: '2세대', min: 152, max: 251 },
            { key: 'gen3', label: '3세대', min: 252, max: 386 },
            { key: 'gen4', label: '4세대', min: 387, max: 493 },
            { key: 'gen5', label: '5세대', min: 494, max: 649 },
            { key: 'gen6', label: '6세대', min: 650, max: 721 },
            { key: 'gen7', label: '7세대', min: 722, max: 809 },
            { key: 'gen8', label: '8세대', min: 810, max: 905 },
            { key: 'gen9', label: '9세대', min: 906, max: 1025 },
            { key: 'national', label: '전국도감', min: 1, max: 1025 }
        ];
        const encounterModes = [
            { key: 'all', label: '모두' },
            { key: 'grass', label: '풀숲' },
            { key: 'water', label: '물' }
        ];
        const typeModes = [
            { key: 'all', label: '모두' },
            // specific types are added dynamically below using pokemonTypeLabels
        ];
        const pokemonTypeLabels = {
            normal: '노말',
            fire: '불꽃',
            water: '물',
            electric: '전기',
            grass: '풀',
            ice: '얼음',
            fighting: '격투',
            poison: '독',
            ground: '땅',
            flying: '비행',
            psychic: '에스퍼',
            bug: '벌레',
            rock: '바위',
            ghost: '고스트',
            dragon: '드래곤',
            dark: '악',
            steel: '강철',
            fairy: '페어리'
        };
        let generationModeIndex = 0;
        let encounterModeIndex = 0;
        let typeModeIndex = 0;
        let shinyOnlyMode = false;
        const typePokemonIdPools = {};

        function applyTheme(theme) {
            if (theme === 'night') {
                document.body.setAttribute('data-theme', 'night');
                themeToggleBtn.textContent = '☀ ';
                themeToggleBtn.setAttribute('aria-label', '낮 모드 전환');
            } else {
                document.body.removeAttribute('data-theme');
                themeToggleBtn.textContent = '🌙 ';
                themeToggleBtn.setAttribute('aria-label', '밤 모드 전환');
            }
        }

        const savedTheme = localStorage.getItem(themeStorageKey);
        const preferDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(savedTheme || (preferDark ? 'night' : 'day'));

        themeToggleBtn.addEventListener('click', () => {
            const nextTheme = document.body.getAttribute('data-theme') === 'night' ? 'day' : 'night';
            applyTheme(nextTheme);
            localStorage.setItem(themeStorageKey, nextTheme);
        });

        function closeAllPickerMenus(exceptWrap = null) {
            [generationPickerWrap, encounterPickerWrap, typePickerWrap].forEach(wrap => {
                if (!wrap || wrap === exceptWrap) {
                    return;
                }

                wrap.classList.remove('open');
                const trigger = wrap.querySelector('.picker-trigger');
                if (trigger) {
                    trigger.setAttribute('aria-expanded', 'false');
                }
            });
        }

        function syncPickerFromSelect(selectEl, triggerEl, menuEl) {
            const selectedOption = selectEl.options[selectEl.selectedIndex];
            if (selectedOption) {
                triggerEl.textContent = selectedOption.textContent;
                triggerEl.title = selectedOption.textContent;
            }

            menuEl.querySelectorAll('.picker-option').forEach(optionBtn => {
                const isActive = optionBtn.dataset.value === selectEl.value;
                optionBtn.classList.toggle('active', isActive);
                optionBtn.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });
        }

        function renderPickerOptions(selectEl, menuEl) {
            menuEl.innerHTML = "";

            Array.from(selectEl.options).forEach(option => {
                const li = document.createElement('li');
                const optionBtn = document.createElement('button');
                optionBtn.type = 'button';
                optionBtn.className = 'picker-option';
                optionBtn.dataset.value = option.value;
                optionBtn.setAttribute('role', 'option');
                optionBtn.textContent = option.textContent;

                optionBtn.addEventListener('click', () => {
                    selectEl.value = option.value;
                    selectEl.dispatchEvent(new Event('change'));
                    closeAllPickerMenus();
                });

                li.appendChild(optionBtn);
                menuEl.appendChild(li);
            });
        }

        function setupPicker(selectEl, wrapEl, triggerEl, menuEl) {
            renderPickerOptions(selectEl, menuEl);
            syncPickerFromSelect(selectEl, triggerEl, menuEl);

            triggerEl.addEventListener('click', (event) => {
                event.stopPropagation();
                const shouldOpen = !wrapEl.classList.contains('open');
                closeAllPickerMenus(shouldOpen ? wrapEl : null);
                wrapEl.classList.toggle('open', shouldOpen);
                triggerEl.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
            });

            triggerEl.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowDown' || event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    if (!wrapEl.classList.contains('open')) {
                        closeAllPickerMenus(wrapEl);
                        wrapEl.classList.add('open');
                        triggerEl.setAttribute('aria-expanded', 'true');
                    }
                }
            });

            menuEl.addEventListener('click', (event) => {
                event.stopPropagation();
            });

            selectEl.addEventListener('change', () => {
                syncPickerFromSelect(selectEl, triggerEl, menuEl);
            });
        }

        function applyGenerationMode(modeKey) {
            const foundIndex = generationModes.findIndex(mode => mode.key === modeKey);
            generationModeIndex = foundIndex >= 0 ? foundIndex : 0;
            const currentMode = generationModes[generationModeIndex];
            generationSelect.value = currentMode.key;
            generationSelect.title = `${currentMode.label} (${currentMode.min}~${currentMode.max})`;
            syncPickerFromSelect(generationSelect, generationTrigger, generationMenu);
            // update type options availability for the selected generation
            updateTypeOptionsForGeneration(currentMode);
        }

        generationModes.forEach(mode => {
            const option = document.createElement('option');
            option.value = mode.key;
            option.textContent = mode.label;
            generationSelect.appendChild(option);
        });

        applyGenerationMode(localStorage.getItem(generationStorageKey) || 'gen1');

        generationSelect.addEventListener('change', () => {
            applyGenerationMode(generationSelect.value);
            localStorage.setItem(generationStorageKey, generationSelect.value);
        });

        function applyEncounterMode(modeKey) {
            const foundIndex = encounterModes.findIndex(mode => mode.key === modeKey);
            encounterModeIndex = foundIndex >= 0 ? foundIndex : 0;
            const currentMode = encounterModes[encounterModeIndex];
            encounterSelect.value = currentMode.key;
            encounterSelect.title = currentMode.label;
            syncPickerFromSelect(encounterSelect, encounterTrigger, encounterMenu);
        }

        encounterModes.forEach(mode => {
            const option = document.createElement('option');
            option.value = mode.key;
            option.textContent = mode.label;
            encounterSelect.appendChild(option);
        });

        setupPicker(generationSelect, generationPickerWrap, generationTrigger, generationMenu);
        setupPicker(encounterSelect, encounterPickerWrap, encounterTrigger, encounterMenu);

        // populate type select with known types
        Object.keys(pokemonTypeLabels).forEach(typeKey => {
            const option = document.createElement('option');
            option.value = typeKey;
            option.textContent = pokemonTypeLabels[typeKey];
            typeSelect.appendChild(option);
        });

        // add 'all' option at top
        const allOption = document.createElement('option');
        allOption.value = 'all';
        allOption.textContent = '모두';
        typeSelect.insertBefore(allOption, typeSelect.firstChild);

        setupPicker(typeSelect, typePickerWrap, typeTrigger, typeMenu);

        applyEncounterMode(localStorage.getItem(encounterStorageKey) || 'all');
        applyTypeMode(localStorage.getItem(typeStorageKey) || 'all');

        encounterSelect.addEventListener('change', () => {
            applyEncounterMode(encounterSelect.value);
            localStorage.setItem(encounterStorageKey, encounterSelect.value);
        });

        typeSelect.addEventListener('change', () => {
            applyTypeMode(typeSelect.value);
            localStorage.setItem(typeStorageKey, typeSelect.value);
        });

        function renderHistory(entries) {
            historyList.innerHTML = '';
            const listItems = Array.isArray(entries) ? entries : [];
            historyCount.textContent = String(listItems.length);
            clearHistoryBtn.disabled = listItems.length === 0;

            if (listItems.length === 0) {
                historyEmpty.style.display = 'block';
                return;
            }

            historyEmpty.style.display = 'none';
            listItems.slice().reverse().forEach(entry => {
                const item = document.createElement('li');
                item.className = 'history-item';

                const title = document.createElement('div');
                title.className = 'history-thumb';

                if (entry.sprite) {
                    const thumb = document.createElement('img');
                    thumb.src = entry.sprite;
                    thumb.alt = `${entry.name} 썸네일`;
                    title.appendChild(thumb);
                }

                const titleText = document.createElement('span');
                titleText.textContent = `${entry.shiny ? '✨ ' : ''}${entry.name}`;
                title.appendChild(titleText);

                const meta = document.createElement('div');
                meta.className = 'history-meta';
                const koreanTypes = entry.types
                    .map(typeKey => pokemonTypeLabels[typeKey] || typeKey)
                    .join(' · ');
                meta.textContent = `No.${entry.id} · ${koreanTypes} · ${entry.time}`;

                item.appendChild(title);
                item.appendChild(meta);
                // add 'add to collection' control
                const controls = document.createElement('div');
                controls.style.marginTop = '6px';
                const addBtn = document.createElement('button');
                addBtn.type = 'button';
                addBtn.className = 'add-to-collection-btn';
                addBtn.textContent = collection[entry.id] ? '등록됨' : '도감에 등록';
                addBtn.disabled = !!collection[entry.id];
                addBtn.addEventListener('click', () => {
                    if (!collection[entry.id]) {
                        collection[entry.id] = { name: entry.name, id: entry.id, types: entry.types, sprite: entry.sprite, time: entry.time };
                        saveCollection();
                        renderCollection();
                        addBtn.textContent = '등록됨';
                        addBtn.disabled = true;
                    }
                });
                controls.appendChild(addBtn);
                item.appendChild(controls);
                historyList.appendChild(item);
            });
        }

        function loadHistory() {
            try {
                const saved = localStorage.getItem(historyStorageKey);
                spinHistory = saved ? JSON.parse(saved) : [];
                if (!Array.isArray(spinHistory)) {
                    spinHistory = [];
                }
            } catch {
                spinHistory = [];
            }

            renderHistory(spinHistory);
        }

        function saveCollection() {
            try {
                localStorage.setItem(collectionStorageKey, JSON.stringify(collection));
            } catch (e) {
                console.warn('도감 저장 실패:', e);
            }
        }

        function loadCollection() {
            try {
                const saved = localStorage.getItem(collectionStorageKey);
                collection = saved ? JSON.parse(saved) : {};
                if (!collection || typeof collection !== 'object') collection = {};
            } catch (e) {
                collection = {};
            }
            renderCollection();
        }

        function renderCollection() {
            if (!collectionGrid) return;
            collectionGrid.innerHTML = '';
            const entries = Object.values(collection || {});
            collectionCountEl.textContent = String(entries.length);
            clearCollectionBtn.disabled = entries.length === 0;

            if (entries.length === 0) {
                const p = document.createElement('p');
                p.className = 'history-empty';
                p.textContent = '아직 도감에 등록된 포켓몬이 없습니다.';
                collectionGrid.appendChild(p);
                return;
            }

            entries.sort((a, b) => a.id - b.id).forEach(e => {
                const tile = document.createElement('div');
                tile.className = 'collection-tile';
                const img = document.createElement('img');
                img.src = e.sprite || '';
                img.alt = e.name || '';
                const name = document.createElement('div');
                name.className = 'collection-name';
                name.textContent = `No.${e.id} ${e.name}`;
                tile.appendChild(img);
                tile.appendChild(name);
                collectionGrid.appendChild(tile);
            });
        }

        function saveHistory() {
            try {
                localStorage.setItem(historyStorageKey, JSON.stringify(spinHistory));
            } catch (error) {
                console.warn('히스토리 저장 실패:', error);
            }
        }

        function clearHistory() {
            spinHistory = [];
            saveHistory();
            renderHistory(spinHistory);
        }

        clearHistoryBtn.addEventListener('click', clearHistory);

        clearCollectionBtn.addEventListener('click', () => {
            if (!confirm('도감을 초기화하시겠어요?')) return;
            collection = {};
            saveCollection();
            renderCollection();
        });

        function addHistoryEntry(name, id, types, shiny, sprite) {
            try {
                const entry = {
                    name,
                    id,
                    types,
                    shiny,
                    sprite,
                    time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
                };
                spinHistory.push(entry);
                saveHistory();
                renderHistory(spinHistory);
                // 자동으로 도감에 등록 (중복 방지)
                if (!collection[id]) {
                    collection[id] = { name, id, types, sprite, time: entry.time };
                    saveCollection();
                    renderCollection();
                }
            } catch (error) {
                console.warn('히스토리 추가 실패:', error);
            }
        }

        loadHistory();
        loadCollection();
        // ensure history UI reflects collection state
        renderHistory(spinHistory);

        document.addEventListener('click', () => {
            closeAllPickerMenus();
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeAllPickerMenus();
            }
        });

        async function getTypePokemonIds(typeKey) {
            if (typePokemonIdPools[typeKey]) {
                return typePokemonIdPools[typeKey];
            }

            const response = await fetch(`https://pokeapi.co/api/v2/type/${typeKey}`);
            const data = await response.json();

            const ids = data.pokemon
                .map(entry => {
                    const matched = entry.pokemon.url.match(/\/pokemon\/(\d+)\/?$/);
                    return matched ? Number(matched[1]) : null;
                })
                .filter(id => Number.isInteger(id) && id >= 1 && id <= 1025);

            typePokemonIdPools[typeKey] = [...new Set(ids)];
            return typePokemonIdPools[typeKey];
        }

        function applyTypeMode(modeKey) {
            const foundIndex = (Object.keys(pokemonTypeLabels).indexOf(modeKey) >= 0) ? Object.keys(pokemonTypeLabels).indexOf(modeKey) + 1 : (modeKey === 'all' ? 0 : -1);
            // If modeKey is 'all', set index 0; otherwise find its index in select
            if (modeKey === 'all') {
                typeModeIndex = 0;
            } else {
                // find option index in the select
                for (let i = 0; i < typeSelect.options.length; i++) {
                    if (typeSelect.options[i].value === modeKey) {
                        typeSelect.selectedIndex = i;
                        typeModeIndex = i;
                        break;
                    }
                }
            }
            const currentLabel = typeSelect.options[typeSelect.selectedIndex]?.textContent || '모두';
            typeTrigger.textContent = currentLabel;
            typeTrigger.title = currentLabel;
            syncPickerFromSelect(typeSelect, typeTrigger, typeMenu);
        }

        async function updateTypeOptionsForGeneration(currentMode) {
            if (!typeSelect) return;
            const min = currentMode.min;
            const max = currentMode.max;
            // iterate over options (skip 'all' option)
            for (let i = 0; i < typeSelect.options.length; i++) {
                const opt = typeSelect.options[i];
                const key = opt.value;
                if (key === 'all') {
                    opt.textContent = '모두';
                    opt.disabled = false;
                    continue;
                }
                try {
                    const ids = await getTypePokemonIds(key);
                    const hasInGeneration = ids.some(id => id >= min && id <= max);
                    if (!hasInGeneration) {
                        const label = pokemonTypeLabels[key] || key;
                        opt.textContent = `${label} — 이 세대에는 ${label} 타입이 없습니다`;
                        opt.disabled = true;
                    } else {
                        opt.textContent = pokemonTypeLabels[key] || key;
                        opt.disabled = false;
                    }
                } catch (e) {
                    // on error, leave option enabled with default label
                    opt.textContent = pokemonTypeLabels[key] || key;
                    opt.disabled = false;
                }
            }

            // if currently selected type is disabled, fallback to 'all'
            const selected = typeSelect.value;
            const selectedOpt = Array.from(typeSelect.options).find(o => o.value === selected);
            if (selectedOpt && selectedOpt.disabled) {
                typeSelect.value = 'all';
                applyTypeMode('all');
                localStorage.setItem(typeStorageKey, 'all');
            } else {
                // ensure UI shows correct label
                syncPickerFromSelect(typeSelect, typeTrigger, typeMenu);
            }
        }

        function applyShinyMode(enabled) {
            shinyOnlyMode = enabled;
            shinyToggleBtn.dataset.on = enabled ? 'true' : 'false';
            shinyToggleBtn.setAttribute('aria-pressed', enabled ? 'true' : 'false');
            shinyToggleBtn.textContent = enabled ? '✨ 이로치 ON' : '✨ 이로치 OFF';
        }

        applyShinyMode(localStorage.getItem(shinyStorageKey) === 'on');

        shinyToggleBtn.addEventListener('click', () => {
            const nextState = !shinyOnlyMode;
            applyShinyMode(nextState);
            localStorage.setItem(shinyStorageKey, nextState ? 'on' : 'off');
        });

        async function spinRoulette() {
            const btn = document.getElementById('spin-btn');
            const pokeball = document.getElementById('pokeball');
            const img = document.getElementById('poke-img');
            const nameDiv = document.getElementById('poke-name');
            const typeDiv = document.getElementById('poke-type');
            
            // 1) 버튼 비활성화 + 이전 결과 초기화
            btn.disabled = true;
            img.style.display = "none";
            nameDiv.innerText = "";
            nameDiv.classList.remove('error');
            typeDiv.style.display = "none";
            typeDiv.innerHTML = "";

            // 2) 몬스터볼 표시 + 흔들림 애니메이션 시작
            pokeball.classList.add('shaking');

            try {
                // 3) 선택한 세대 + 조우 타입 기준으로 랜덤 포켓몬 ID 선택
                const currentMode = generationModes[generationModeIndex];
                const encounterMode = encounterModes[encounterModeIndex];
                let randomId = null;

                // Build candidate ID list based on encounter and generation
                let candidateIds = [];
                if (encounterMode.key === 'all') {
                    for (let i = currentMode.min; i <= currentMode.max; i++) candidateIds.push(i);
                } else {
                    const encounterIds = await getTypePokemonIds(encounterMode.key);
                    candidateIds = encounterIds.filter(id => id >= currentMode.min && id <= currentMode.max);
                }

                if (candidateIds.length === 0) {
                    throw new Error('NO_POKEMON_IN_RANGE');
                }

                // 타입 필터 적용 (선택한 타입이 'all'이 아닌 경우)
                const typeMode = typeSelect ? { key: typeSelect.value } : { key: 'all' };
                if (typeMode.key && typeMode.key !== 'all') {
                    const typeIds = await getTypePokemonIds(typeMode.key);
                    const typeSet = new Set(typeIds);
                    candidateIds = candidateIds.filter(id => typeSet.has(id));
                }

                if (candidateIds.length === 0) {
                    throw new Error('NO_POKEMON_IN_RANGE');
                }

                // pick randomId from candidate list
                randomId = candidateIds[Math.floor(Math.random() * candidateIds.length)];

                // 5) PokeAPI에서 포켓몬 데이터 가져오기
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${randomId}`);
                const data = await response.json();
                
                // 선택: species 엔드포인트에서 한국어 이름 가져오기
                const speciesResponse = await fetch(data.species.url);
                const speciesData = await speciesResponse.json();
                const koNameObj = speciesData.names.find(n => n.language.name === 'ko');
                const pokemonName = koNameObj ? koNameObj.name : data.name;
                const pokemonTypes = data.types
                    .slice()
                    .sort((a, b) => a.slot - b.slot)
                    .map(t => t.type.name);

                // 5) 3초 후 결과 공개
                setTimeout(() => {
                    try {
                        pokeball.classList.remove('shaking'); // 몬스터볼 애니메이션 숨김
                        const shinySprite = data.sprites.front_shiny;
                        const normalSprite = data.sprites.front_default;
                        const useShiny = shinyOnlyMode && !!shinySprite;
                        img.src = useShiny ? shinySprite : normalSprite; // 포켓몬 스프라이트 설정
                        img.style.display = "block"; // 포켓몬 스프라이트 표시
                        typeDiv.innerHTML = pokemonTypes
                            .map(typeKey => `<span class="type-chip type-${typeKey}">${pokemonTypeLabels[typeKey] || typeKey}</span>`)
                            .join('');
                        typeDiv.style.display = "flex"; // 포켓몬 타입 표시
                        nameDiv.classList.remove('error');
                        nameDiv.innerText = `${useShiny ? '✨ ' : ''}${pokemonName} (No.${randomId})`; // 포켓몬 이름 표시
                        addHistoryEntry(pokemonName, randomId, pokemonTypes, useShiny, useShiny ? shinySprite : normalSprite);
                    } catch (error) {
                        console.warn('결과 표시 중 오류:', error);
                        nameDiv.innerText = '결과 표시 중 오류가 발생했습니다.';
                        nameDiv.classList.add('error');
                    } finally {
                        btn.disabled = false; // 버튼 다시 활성화
                    }
                }, 3000);

            } catch (error) {
                pokeball.classList.remove('shaking');
                nameDiv.innerText = error.message === 'NO_POKEMON_IN_RANGE'
                    ? "해당 세대에 조우 가능한 포켓몬이 없어요!"
                    : "오류 발생!";
                nameDiv.classList.add('error');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
